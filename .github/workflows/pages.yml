name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        # main holds only the onechat page (index.html at the repo root).
        # Copy only the page and its assets so nothing else in the repo is published.
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest OneChat.webp _site/
          cp -r icons _site/

      - name: Stamp build info
        # Fills the commit hash and build time shown in the OneChat menu
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sed -i "s/__BUILD_COMMIT__/${GITHUB_SHA}/; s/__BUILD_TIME__/${BUILD_TIME}/" _site/index.html
          grep -q "${GITHUB_SHA}" _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
